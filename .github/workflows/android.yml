# Gera o APK do Android a cada push na main e publica em Releases.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install

      # O build "release" do Expo é assinado com a chave de debug: instala direto no celular.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RadioLog.apk
          gh release create "v0.1.${{ github.run_number }}" RadioLog.apk \
            --title "RadioLog v0.1.${{ github.run_number }}" \
            --notes "Baixe RadioLog.apk no celular Android e instale."
